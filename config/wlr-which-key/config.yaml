# Theming
font: JetBrainsMono Nerd Font 12
background: "#191724b0"
color: "#e0def4"
border: "#31748f"
separator: " - "
border_width: 1
corner_r: 10
padding: 15
anchor: center
inhibit_compositor_keyboard_shortcuts: true

menu:
  - key: "f"
    desc: zen-browser
    cmd: zen-browser

  - key: "t"
    desc: Google Calendar
    cmd: zen-browser https://calendar.google.com

  - key: "o"
    desc: Obsidian
    cmd: obsidian

  - key: "g"
    desc: GitHub
    submenu:
      - key: "p"
        desc: Profile (PS-Wizard)
        cmd: zen-browser https://github.com/PS-Wizard/
      - key: "d"
        desc: Dotfiles
        cmd: zen-browser https://github.com/PS-Wizard/Dotfiles
      - key: "s"
        desc: School
        cmd: zen-browser https://github.com/PS-Wizard/School

  - key: "l"
    desc: AI
    submenu:
      - key: "1"
        desc: ChatGPT
        cmd: zen-browser https://chatgpt.com
      - key: "2"
        desc: Gemini
        cmd: zen-browser https://gemini.google.com
      - key: "3"
        desc: Notebooklm
        cmd: zen-browser https://notebooklm.google.com/

  - key: "u"
    desc: Usage Limits Codex
    submenu:
      - key: "c"
        desc: Chatgpt Codex Usage Limits
        cmd: zen-browser https://chatgpt.com/#settings/Usage
      - key: "g"
        desc: Opencode Go Usage
        cmd: zen-browser https://opencode.ai/console/wrk_01KHAZWE1K94HYM2BE8VVNCWR3/go
      - key: "h"
        desc: Opencode Go
        cmd: zen-browser https://opencode.ai/go

  - key: "n"
    desc: Night Shift
    submenu:
      - key: "1"
        desc: Warm (5000K)
        cmd: hyprctl hyprsunset temperature 5000
      - key: "2"
        desc: Warmer (4000K)
        cmd: hyprctl hyprsunset temperature 4000
      - key: "3"
        desc: Very Warm (3500K)
        cmd: hyprctl hyprsunset temperature 3500
      - key: "4"
        desc: Warmest (3000K)
        cmd: hyprctl hyprsunset temperature 3000
      - key: "0"
        desc: Off
        cmd: hyprctl hyprsunset temperature 6500

  - key: "b"
    desc: Brightness
    submenu:
      - key: "1"
        desc: 90%
        cmd: hyprctl hyprsunset gamma 90
      - key: "2"
        desc: 75%
        cmd: hyprctl hyprsunset gamma 75
      - key: "3"
        desc: 50%
        cmd: hyprctl hyprsunset gamma 50
      - key: "0"
        desc: Normal (100%)
        cmd: hyprctl hyprsunset gamma 100
  - key: "d"
    desc: Wayscriber
    cmd: pkill wayscriber; wayscriber --freeze

  - key: "w"
    desc: Reload
    submenu:
      - key: "w"
        desc: Reload waybar
        cmd: pkill waybar && waybar -c ~/.config/waybar/config.json -s ~/.config/waybar/style.css
      - key: "h"
        desc: Reload hyprland
        cmd: hyprctl reload
      - key: "b"
        desc: Restart swaybg
        cmd: pkill swaybg; swaybg -i ~/.config/hypr/wallpaper.jpg

  - key: "i"
    desc: Toggle Monochrome
    cmd: /home/wizard/.config/hypr/scripts/toggle-monochrome.sh

  - key: "m"
    desc: Markdown Viewer Web
    cmd: zen-browser https://markdn.vercel.app/

  - key: "r"
    desc: Recording
    submenu:
      - key: "h"
        desc: High (ultra)
        submenu:
          - key: "r"
            desc: No audio
            submenu:
              - key: "3"
                desc: 30 FPS
                cmd: gpu-screen-recorder -w screen -f 30 -fm cfr -q ultra -k h264 -encoder gpu -tune quality -o ~/recording.mp4
              - key: "6"
                desc: 60 FPS
                cmd: gpu-screen-recorder -w screen -f 60 -fm cfr -q ultra -k h264 -encoder gpu -tune quality -o ~/recording.mp4
          - key: "a"
            desc: With audio
            submenu:
              - key: "3"
                desc: 30 FPS
                cmd: gpu-screen-recorder -w screen -f 30 -fm cfr -q ultra -k h264 -encoder gpu -tune quality -a default_output -o ~/recording.mp4
              - key: "6"
                desc: 60 FPS
                cmd: gpu-screen-recorder -w screen -f 60 -fm cfr -q ultra -k h264 -encoder gpu -tune quality -a default_output -o ~/recording.mp4

      - key: "l"
        desc: Low (medium)
        submenu:
          - key: "r"
            desc: No audio
            submenu:
              - key: "3"
                desc: 30 FPS
                cmd: gpu-screen-recorder -w screen -f 30 -fm cfr -q medium -k h264 -encoder gpu -o ~/recording.mp4
              - key: "6"
                desc: 60 FPS
                cmd: gpu-screen-recorder -w screen -f 60 -fm cfr -q medium -k h264 -encoder gpu -o ~/recording.mp4
          - key: "a"
            desc: With audio
            submenu:
              - key: "3"
                desc: 30 FPS
                cmd: gpu-screen-recorder -w screen -f 30 -fm cfr -q medium -k h264 -encoder gpu -a default_output -o ~/recording.mp4
              - key: "6"
                desc: 60 FPS
                cmd: gpu-screen-recorder -w screen -f 60 -fm cfr -q medium -k h264 -encoder gpu -a default_output -o ~/recording.mp4

      - key: "q"
        desc: Kill
        cmd: killall gpu-screen-recorder

  - key: "s"
    desc: Fan Control
    submenu:
      - key: "1"
        desc: 25% (Silent-ish)
        cmd: nbfc set -s 25
      - key: "2"
        desc: 50% (Balanced)
        cmd: nbfc set -s 50
      - key: "3"
        desc: 75% (Performance)
        cmd: nbfc set -s 75
      - key: "4"
        desc: 100% (Jet Engine)
        cmd: nbfc set -s 100
      - key: "0"
        desc: Auto
        cmd: nbfc set -a

  - key: "q"
    desc: Stop Recording
    cmd: killall gpu-screen-recorder
