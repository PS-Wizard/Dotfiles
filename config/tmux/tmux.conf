##### Terminal Settings #####
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on
set -ag terminal-overrides ",xterm-256color:RGB"
set -s extended-keys always
set -g extended-keys-format csi-u


set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
##### Prefix Key #####
unbind C-b
set -g prefix C-s
bind C-s send-prefix
##### Pane & Window Bindings #####
bind n new-window -c "#{pane_current_path}"

bind Enter display-popup -E -S "fg=#26233a" "~/.config/tmux/send-to-pane.sh"
bind g run-shell "cd #{pane_current_path} && ~/.config/tmux/github.sh"

bind z run-shell "~/.config/tmux/zen.sh"


bind -n M-Space display-popup -E -S "fg=#26233a" "~/.config/tmux/sessions.sh"
bind -n M-Enter run-shell "~/.config/tmux/dwindle.sh"
bind S command-prompt -p "session name (blank = auto):" "run-shell '~/.config/tmux/new-session.sh \"%%\"'"

##### Window Navigation (Alt + number) #####
unbind -n M-1
unbind -n M-2
unbind -n M-3
unbind -n M-4
unbind -n M-5
unbind -n M-6
unbind -n M-7
unbind -n M-8
unbind -n M-9
unbind -n M-0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

#### Hide Tmux Statusbar ####
bind -n M-p set -g status
##### Mouse Support #####
set -g mouse on
##### Status Bar #####
set -g status-style bg=default,fg=#908caa
set -g status-left ""
set -g status-right ""
set -g status-justify absolute-centre
# Hide the pane title unless the current window has multiple panes.
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g window-status-current-format "#[fg=#f6c177,bold] #I:#W "
set -g window-status-style bg=default,fg=#908caa
set -g window-status-current-style bg=default,fg=#e0def4
# Thin pane separators; the status title shows focus.
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style fg=#3f3d4a
set -g pane-active-border-style fg=#3f3d4a
set -g renumber-windows on
##### Reload Config #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
##### Copy Mode (Vim-style) #####
setw -g mode-keys vi
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j
unbind -T copy-mode-vi C-k
unbind -T copy-mode-vi C-l
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
set-option -g status-position bottom

##### Prefix-based Window Merge & Break #####
bind m command-prompt -1 -p "Merge window: " "join-pane -h -s :%%"
bind b break-pane



#### Alt+Shift Pane Movement (like WM) ####
bind -n M-H run-shell '~/.config/tmux/move-pane.sh left #{pane_id}'
bind -n M-J run-shell '~/.config/tmux/move-pane.sh down #{pane_id}'
bind -n M-K run-shell '~/.config/tmux/move-pane.sh up #{pane_id}'
bind -n M-L run-shell '~/.config/tmux/move-pane.sh right #{pane_id}'
##### Alt + Vim-style Pane Navigation #####
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
bind -n M-h if -F '#{==:#{pane_at_left},0}' 'select-pane -L'
bind -n M-j if -F '#{==:#{pane_at_bottom},0}' 'select-pane -D'
bind -n M-k if -F '#{==:#{pane_at_top},0}' 'select-pane -U'
bind -n M-l if -F '#{==:#{pane_at_right},0}' 'select-pane -R'
bind -n M-f if -F '#{==:#{window_zoomed_flag},1}' 'resize-pane -Z' 'resize-pane -Z'

##### Resize Mode #####
bind -n C-r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize C-r switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root
# Terminal passthrough for modified keys some apps need inside tmux.
# S-Enter is not a distinct key in most terminals, but CSI-u / extkeys lets apps
# receive Ctrl/Alt/other modified keys reliably when the terminal supports them.
set -g user-keys[0] "User0"
bind-key -n User0 send-keys User0
